<svg width="358" height="180" viewBox="0 0 358 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vwp-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d4b0"/>
      <stop offset="100%" stop-color="#c8aa80"/>
    </linearGradient>
    <linearGradient id="vwp-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a8854"/>
      <stop offset="100%" stop-color="#5a6840"/>
    </linearGradient>
    <linearGradient id="vwp-wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a0"/>
      <stop offset="100%" stop-color="#b89868"/>
    </linearGradient>
    <linearGradient id="vwp-roof" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c5234"/>
      <stop offset="100%" stop-color="#5a3a20"/>
    </linearGradient>
    <linearGradient id="vwp-pool" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#94c4d4"/>
      <stop offset="100%" stop-color="#6a98ac"/>
    </linearGradient>
    <linearGradient id="vwp-foliage" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a6238"/>
      <stop offset="100%" stop-color="#2c3e20"/>
    </linearGradient>
    <radialGradient id="vwp-vignette" cx="50%" cy="40%" r="80%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(44,26,14,0.18)"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="358" height="180" fill="url(#vwp-sky)"/>
  <!-- Distant tree mass -->
  <ellipse cx="60" cy="90" rx="80" ry="22" fill="#7a8a5a" opacity="0.55"/>
  <ellipse cx="290" cy="82" rx="90" ry="20" fill="#7a8a5a" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="118" width="358" height="62" fill="url(#vwp-ground)"/>
  <!-- Shadow under house -->
  <ellipse cx="108" cy="142" rx="80" ry="5" fill="#000" opacity="0.15"/>
  <!-- House body -->
  <rect x="42" y="78" width="130" height="62" fill="url(#vwp-wall)"/>
  <rect x="42" y="78" width="7" height="62" fill="#000" opacity="0.14"/>
  <rect x="165" y="78" width="7" height="62" fill="#fff" opacity="0.1"/>
  <!-- Roof -->
  <polygon points="30,80 107,44 184,80" fill="url(#vwp-roof)"/>
  <polygon points="30,80 107,44 107,80" fill="#000" opacity="0.1"/>
  <!-- Chimney -->
  <rect x="138" y="50" width="10" height="22" fill="#5a3a20"/>
  <rect x="135" y="47" width="16" height="5" fill="#3c2814"/>
  <!-- Front door -->
  <rect x="96" y="106" width="22" height="34" rx="1" fill="#3c2814"/>
  <rect x="98" y="108" width="8" height="13" fill="#5a3a20" opacity="0.6"/>
  <rect x="108" y="108" width="8" height="13" fill="#5a3a20" opacity="0.6"/>
  <circle cx="118" cy="124" r="1.2" fill="#c9a84c"/>
  <!-- Left window -->
  <rect x="52" y="90" width="22" height="16" rx="1" fill="#3c4838"/>
  <rect x="52" y="90" width="22" height="16" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="63" y1="90" x2="63" y2="106" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="52" y1="98" x2="74" y2="98" stroke="#5a3a20" stroke-width="0.5"/>
  <rect x="50" y="90" width="2" height="16" fill="#3c2814" opacity="0.6"/>
  <rect x="74" y="90" width="2" height="16" fill="#3c2814" opacity="0.6"/>
  <!-- Right window -->
  <rect x="134" y="90" width="22" height="16" rx="1" fill="#3c4838"/>
  <rect x="134" y="90" width="22" height="16" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="145" y1="90" x2="145" y2="106" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="134" y1="98" x2="156" y2="98" stroke="#5a3a20" stroke-width="0.5"/>
  <rect x="132" y="90" width="2" height="16" fill="#3c2814" opacity="0.6"/>
  <rect x="156" y="90" width="2" height="16" fill="#3c2814" opacity="0.6"/>
  <!-- Pool -->
  <rect x="188" y="90" width="148" height="40" rx="4" fill="url(#vwp-pool)"/>
  <rect x="188" y="90" width="148" height="40" rx="4" fill="none" stroke="#4a7080" stroke-width="0.8"/>
  <path d="M194 102 Q214 98 234 102 Q254 106 274 102 Q294 98 330 102" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.6"/>
  <path d="M194 114 Q214 110 234 114 Q254 118 274 114 Q294 110 330 114" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
  <!-- Pool ladder -->
  <rect x="328" y="85" width="5" height="8" fill="#a89878"/>
  <line x1="328" y1="87" x2="333" y2="87" stroke="#888" stroke-width="0.6"/>
  <line x1="328" y1="91" x2="333" y2="91" stroke="#888" stroke-width="0.6"/>
  <!-- Lounger -->
  <rect x="200" y="134" width="20" height="3" rx="1" fill="#a89878"/>
  <rect x="198" y="137" width="3" height="4" fill="#7a6a4a"/>
  <rect x="219" y="137" width="3" height="4" fill="#7a6a4a"/>
  <!-- Palm tree -->
  <rect x="174" y="72" width="5" height="50" rx="2" fill="#5a3a20"/>
  <ellipse cx="176" cy="64" rx="18" ry="10" fill="url(#vwp-foliage)" transform="rotate(-15 176 64)"/>
  <ellipse cx="181" cy="60" rx="14" ry="8" fill="#5a8a44" transform="rotate(20 181 60)"/>
  <ellipse cx="170" cy="66" rx="12" ry="7" fill="url(#vwp-foliage)" transform="rotate(-40 170 66)"/>
  <circle cx="176" cy="72" r="2" fill="#5a3a20"/>
  <circle cx="178" cy="74" r="2" fill="#5a3a20"/>
  <!-- Shrubs -->
  <ellipse cx="26" cy="140" rx="18" ry="9" fill="url(#vwp-foliage)"/>
  <ellipse cx="40" cy="138" rx="12" ry="7" fill="#5a8a44"/>
  <!-- Flowers -->
  <circle cx="18" cy="144" r="2" fill="#d4735e"/>
  <circle cx="22" cy="142" r="2" fill="#e89a6e"/>
  <!-- Vignette -->
  <rect width="358" height="180" fill="url(#vwp-vignette)"/>
  <!-- Kasavu border -->
  <rect x="4" y="4" width="350" height="172" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="8" y="8" width="342" height="164" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.7"/>
  <!-- Corner ornaments -->
  <rect x="4" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="4" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
</svg>
