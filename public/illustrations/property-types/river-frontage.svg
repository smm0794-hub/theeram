<svg width="358" height="180" viewBox="0 0 358 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rf-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d4b0"/>
      <stop offset="100%" stop-color="#c8aa80"/>
    </linearGradient>
    <linearGradient id="rf-river" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a8b8c8"/>
      <stop offset="50%" stop-color="#7a9098"/>
      <stop offset="100%" stop-color="#5a7078"/>
    </linearGradient>
    <linearGradient id="rf-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6a7448"/>
      <stop offset="100%" stop-color="#4a5430"/>
    </linearGradient>
    <linearGradient id="rf-wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a0"/>
      <stop offset="100%" stop-color="#b89868"/>
    </linearGradient>
    <linearGradient id="rf-roof" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c5234"/>
      <stop offset="100%" stop-color="#5a3a20"/>
    </linearGradient>
    <linearGradient id="rf-foliage" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a6238"/>
      <stop offset="100%" stop-color="#2c3e20"/>
    </linearGradient>
    <radialGradient id="rf-vignette" cx="50%" cy="40%" r="80%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(44,26,14,0.2)"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="358" height="180" fill="url(#rf-sky)"/>
  <!-- Distant far bank tree line -->
  <rect x="0" y="86" width="358" height="18" fill="#5a6a40" opacity="0.65"/>
  <ellipse cx="60" cy="86" rx="50" ry="16" fill="#3c4828"/>
  <ellipse cx="200" cy="84" rx="80" ry="18" fill="#3c4828"/>
  <ellipse cx="320" cy="86" rx="50" ry="14" fill="#3c4828"/>
  <!-- River -->
  <rect x="0" y="100" width="358" height="50" fill="url(#rf-river)"/>
  <path d="M0 110 Q40 106 80 110 Q120 114 160 110 Q200 106 240 110 Q280 114 320 110 Q340 108 358 110" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.4"/>
  <path d="M0 122 Q40 118 80 122 Q120 126 160 122 Q200 118 240 122 Q280 126 320 122 Q340 120 358 122" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <path d="M0 136 Q60 132 120 136 Q180 140 240 136 Q300 132 358 136" fill="none" stroke="#fff" stroke-width="0.4" opacity="0.2"/>
  <!-- Villa reflection on water -->
  <rect x="18" y="100" width="90" height="22" fill="#a89878" opacity="0.2"/>
  <!-- Foreground bank -->
  <rect x="0" y="148" width="358" height="32" fill="url(#rf-ground)"/>
  <ellipse cx="179" cy="156" rx="179" ry="5" fill="#000" opacity="0.18"/>
  <!-- Villa building -->
  <rect x="18" y="60" width="90" height="42" fill="url(#rf-wall)"/>
  <rect x="18" y="60" width="6" height="42" fill="#000" opacity="0.16"/>
  <!-- Gabled roof -->
  <polygon points="10,62 63,38 116,62" fill="url(#rf-roof)"/>
  <polygon points="10,62 63,38 63,62" fill="#000" opacity="0.12"/>
  <!-- Verandah deck extending to water -->
  <rect x="18" y="100" width="90" height="7" fill="#7c5234"/>
  <rect x="18" y="107" width="90" height="3" fill="#5a3a20"/>
  <!-- Wooden jetty steps -->
  <rect x="50" y="103" width="18" height="48" fill="#7c5234" opacity="0.8"/>
  <line x1="50" y1="116" x2="68" y2="116" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="50" y1="128" x2="68" y2="128" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="50" y1="140" x2="68" y2="140" stroke="#5a3a20" stroke-width="0.5"/>
  <!-- Door -->
  <rect x="52" y="76" width="18" height="24" fill="#3c2814"/>
  <line x1="61" y1="76" x2="61" y2="100" stroke="#5a3a20" stroke-width="0.6"/>
  <!-- Windows -->
  <rect x="24" y="72" width="16" height="16" rx="1" fill="#3c4838"/>
  <rect x="24" y="72" width="16" height="16" rx="1" fill="none" stroke="#3c2814" stroke-width="0.7"/>
  <line x1="32" y1="72" x2="32" y2="88" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="24" y1="80" x2="40" y2="80" stroke="#5a3a20" stroke-width="0.5"/>
  <rect x="86" y="72" width="16" height="16" rx="1" fill="#3c4838"/>
  <rect x="86" y="72" width="16" height="16" rx="1" fill="none" stroke="#3c2814" stroke-width="0.7"/>
  <line x1="94" y1="72" x2="94" y2="88" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="86" y1="80" x2="102" y2="80" stroke="#5a3a20" stroke-width="0.5"/>
  <!-- Tall coconut palms -->
  <rect x="132" y="34" width="8" height="74" rx="4" fill="#3c2814"/>
  <ellipse cx="136" cy="24" rx="28" ry="16" fill="url(#rf-foliage)"/>
  <ellipse cx="146" cy="16" rx="18" ry="12" fill="#5a8a44"/>
  <ellipse cx="124" cy="20" rx="16" ry="10" fill="url(#rf-foliage)"/>
  <circle cx="136" cy="36" r="3" fill="#3c2814"/>
  <circle cx="139" cy="39" r="3" fill="#3c2814"/>

  <rect x="220" y="52" width="7" height="56" rx="3" fill="#3c2814"/>
  <ellipse cx="223" cy="40" rx="22" ry="14" fill="url(#rf-foliage)"/>
  <ellipse cx="232" cy="32" rx="16" ry="10" fill="#5a8a44"/>
  <!-- Foreground reeds -->
  <line x1="300" y1="148" x2="300" y2="136" stroke="#5a6a40" stroke-width="1.5"/>
  <line x1="308" y1="150" x2="308" y2="138" stroke="#5a6a40" stroke-width="1.5"/>
  <line x1="316" y1="148" x2="316" y2="134" stroke="#5a6a40" stroke-width="1.5"/>
  <line x1="324" y1="150" x2="324" y2="140" stroke="#5a6a40" stroke-width="1.5"/>
  <ellipse cx="312" cy="152" rx="20" ry="4" fill="#3c4828"/>
  <!-- Bird on water -->
  <path d="M260 130 q3 -3 6 0 q3 -3 6 0" fill="none" stroke="#2C1A0E" stroke-width="0.8" opacity="0.45"/>
  <!-- Vignette -->
  <rect width="358" height="180" fill="url(#rf-vignette)"/>
  <!-- Kasavu border -->
  <rect x="4" y="4" width="350" height="172" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="8" y="8" width="342" height="164" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.7"/>
  <rect x="4" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="4" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
</svg>
