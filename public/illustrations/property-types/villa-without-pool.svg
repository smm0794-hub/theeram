<svg width="358" height="180" viewBox="0 0 358 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vnp-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d4b0"/>
      <stop offset="100%" stop-color="#c8aa80"/>
    </linearGradient>
    <linearGradient id="vnp-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a8854"/>
      <stop offset="100%" stop-color="#5a6840"/>
    </linearGradient>
    <linearGradient id="vnp-wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a0"/>
      <stop offset="100%" stop-color="#b89868"/>
    </linearGradient>
    <linearGradient id="vnp-roof" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c5234"/>
      <stop offset="100%" stop-color="#5a3a20"/>
    </linearGradient>
    <linearGradient id="vnp-wing" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c8a878"/>
      <stop offset="100%" stop-color="#a08050"/>
    </linearGradient>
    <linearGradient id="vnp-foliage" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a6238"/>
      <stop offset="100%" stop-color="#2c3e20"/>
    </linearGradient>
    <radialGradient id="vnp-vignette" cx="50%" cy="40%" r="80%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(44,26,14,0.18)"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="358" height="180" fill="url(#vnp-sky)"/>
  <!-- Distant hills -->
  <path d="M0 96 Q60 82 120 92 Q180 80 240 88 Q300 84 358 90 L358 120 L0 120 Z" fill="#7a8a5a" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="116" width="358" height="64" fill="url(#vnp-ground)"/>
  <ellipse cx="130" cy="144" rx="110" ry="6" fill="#000" opacity="0.13"/>
  <!-- Main wide house -->
  <rect x="18" y="80" width="196" height="62" fill="url(#vnp-wall)"/>
  <rect x="18" y="80" width="7" height="62" fill="#000" opacity="0.14"/>
  <!-- Tall gabled roof -->
  <polygon points="8,82 116,38 224,82" fill="url(#vnp-roof)"/>
  <polygon points="8,82 116,38 116,82" fill="#000" opacity="0.12"/>
  <!-- Side wing -->
  <rect x="214" y="96" width="70" height="46" fill="url(#vnp-wing)"/>
  <rect x="214" y="96" width="5" height="46" fill="#000" opacity="0.16"/>
  <polygon points="208,98 249,78 292,98" fill="#5a3a20"/>
  <!-- Twin front doors -->
  <rect x="102" y="104" width="28" height="38" fill="#3c2814"/>
  <rect x="104" y="106" width="11" height="22" fill="#5a3a20" opacity="0.6"/>
  <rect x="117" y="106" width="11" height="22" fill="#5a3a20" opacity="0.6"/>
  <line x1="116" y1="104" x2="116" y2="142" stroke="#5a3a20" stroke-width="0.8"/>
  <rect x="100" y="102" width="32" height="4" fill="#5a3a20"/>
  <!-- Left window -->
  <rect x="28" y="96" width="26" height="20" rx="1" fill="#3c4838"/>
  <rect x="28" y="96" width="26" height="20" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="41" y1="96" x2="41" y2="116" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="28" y1="106" x2="54" y2="106" stroke="#5a3a20" stroke-width="0.5"/>
  <rect x="26" y="96" width="2" height="20" fill="#3c2814" opacity="0.6"/>
  <rect x="54" y="96" width="2" height="20" fill="#3c2814" opacity="0.6"/>
  <!-- Right window -->
  <rect x="170" y="96" width="26" height="20" rx="1" fill="#3c4838"/>
  <rect x="170" y="96" width="26" height="20" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="183" y1="96" x2="183" y2="116" stroke="#5a3a20" stroke-width="0.5"/>
  <line x1="170" y1="106" x2="196" y2="106" stroke="#5a3a20" stroke-width="0.5"/>
  <rect x="168" y="96" width="2" height="20" fill="#3c2814" opacity="0.6"/>
  <rect x="196" y="96" width="2" height="20" fill="#3c2814" opacity="0.6"/>
  <!-- Wing window -->
  <rect x="226" y="108" width="18" height="16" rx="1" fill="#3c4838"/>
  <rect x="226" y="108" width="18" height="16" rx="1" fill="none" stroke="#3c2814" stroke-width="0.7"/>
  <line x1="235" y1="108" x2="235" y2="124" stroke="#5a3a20" stroke-width="0.4"/>
  <!-- Entry steps -->
  <rect x="98" y="142" width="36" height="3" fill="#a89878"/>
  <rect x="94" y="145" width="44" height="3" fill="#8a7858"/>
  <!-- Large mango tree left -->
  <rect x="4" y="78" width="8" height="64" rx="4" fill="#3c2814"/>
  <ellipse cx="8" cy="68" rx="26" ry="22" fill="url(#vnp-foliage)"/>
  <ellipse cx="14" cy="58" rx="18" ry="16" fill="#5a8a44"/>
  <ellipse cx="0" cy="70" rx="14" ry="12" fill="url(#vnp-foliage)"/>
  <!-- Right tree -->
  <rect x="308" y="96" width="6" height="46" rx="3" fill="#3c2814"/>
  <ellipse cx="311" cy="86" rx="20" ry="18" fill="url(#vnp-foliage)"/>
  <ellipse cx="320" cy="78" rx="14" ry="12" fill="#5a8a44"/>
  <!-- Shrubs and flowers -->
  <ellipse cx="54" cy="142" rx="16" ry="8" fill="url(#vnp-foliage)"/>
  <ellipse cx="240" cy="144" rx="14" ry="7" fill="url(#vnp-foliage)"/>
  <circle cx="76" cy="146" r="2" fill="#d4735e"/>
  <circle cx="80" cy="144" r="2" fill="#e89a6e"/>
  <circle cx="220" cy="147" r="2" fill="#d4735e"/>
  <circle cx="224" cy="145" r="2" fill="#e89a6e"/>
  <!-- Vignette -->
  <rect width="358" height="180" fill="url(#vnp-vignette)"/>
  <!-- Kasavu border -->
  <rect x="4" y="4" width="350" height="172" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="8" y="8" width="342" height="164" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.7"/>
  <rect x="4" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="4" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
</svg>
