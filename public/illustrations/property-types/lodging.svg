<svg width="358" height="180" viewBox="0 0 358 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ldg-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d4b0"/>
      <stop offset="100%" stop-color="#c8aa80"/>
    </linearGradient>
    <linearGradient id="ldg-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a7060"/>
      <stop offset="100%" stop-color="#5a5048"/>
    </linearGradient>
    <linearGradient id="ldg-wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a0"/>
      <stop offset="100%" stop-color="#b89868"/>
    </linearGradient>
    <linearGradient id="ldg-foliage" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a6238"/>
      <stop offset="100%" stop-color="#2c3e20"/>
    </linearGradient>
    <radialGradient id="ldg-vignette" cx="50%" cy="40%" r="80%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(44,26,14,0.2)"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="358" height="180" fill="url(#ldg-sky)"/>
  <!-- Ground / street -->
  <rect x="0" y="134" width="358" height="46" fill="url(#ldg-ground)"/>
  <rect x="0" y="142" width="358" height="22" fill="#6a6050" opacity="0.5"/>
  <line x1="0" y1="153" x2="358" y2="153" stroke="#FAF7F2" stroke-width="0.7" stroke-dasharray="8 10" opacity="0.4"/>
  <!-- Building shadow -->
  <ellipse cx="179" cy="142" rx="179" ry="4" fill="#000" opacity="0.22"/>
  <!-- Main 2-storey block -->
  <rect x="10" y="48" width="338" height="88" fill="url(#ldg-wall)"/>
  <rect x="10" y="48" width="8" height="88" fill="#000" opacity="0.14"/>
  <rect x="340" y="48" width="8" height="88" fill="#fff" opacity="0.1"/>
  <!-- Flat parapet top -->
  <rect x="6" y="40" width="346" height="10" fill="#5a3a20"/>
  <rect x="6" y="40" width="346" height="3" fill="#3c2814"/>
  <!-- Floor divider -->
  <rect x="10" y="90" width="338" height="5" fill="#5a3a20" opacity="0.55"/>
  <!-- Signboard -->
  <rect x="104" y="20" width="150" height="22" rx="2" fill="#3c2814"/>
  <rect x="108" y="24" width="142" height="14" rx="1" fill="#5a3a20"/>
  <rect x="116" y="28" width="60" height="6" fill="#c9a84c" opacity="0.85"/>
  <rect x="182" y="28" width="36" height="6" fill="#c9a84c" opacity="0.55"/>
  <!-- Upper floor: 4 windows -->
  <rect x="22" y="56" width="60" height="26" rx="1" fill="#3c4838"/>
  <rect x="22" y="56" width="60" height="26" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="52" y1="56" x2="52" y2="82" stroke="#5a3a20" stroke-width="0.6"/>
  <line x1="22" y1="69" x2="82" y2="69" stroke="#5a3a20" stroke-width="0.6"/>
  <rect x="20" y="56" width="2" height="26" fill="#3c2814" opacity="0.6"/>
  <rect x="82" y="56" width="2" height="26" fill="#3c2814" opacity="0.6"/>

  <rect x="102" y="56" width="60" height="26" rx="1" fill="#3c4838"/>
  <rect x="102" y="56" width="60" height="26" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="132" y1="56" x2="132" y2="82" stroke="#5a3a20" stroke-width="0.6"/>
  <line x1="102" y1="69" x2="162" y2="69" stroke="#5a3a20" stroke-width="0.6"/>

  <!-- Lit window -->
  <rect x="180" y="56" width="60" height="26" rx="1" fill="#f4d4a0" opacity="0.75"/>
  <rect x="180" y="56" width="60" height="26" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="210" y1="56" x2="210" y2="82" stroke="#5a3a20" stroke-width="0.6"/>
  <line x1="180" y1="69" x2="240" y2="69" stroke="#5a3a20" stroke-width="0.6"/>

  <rect x="258" y="56" width="60" height="26" rx="1" fill="#3c4838"/>
  <rect x="258" y="56" width="60" height="26" rx="1" fill="none" stroke="#3c2814" stroke-width="0.8"/>
  <line x1="288" y1="56" x2="288" y2="82" stroke="#5a3a20" stroke-width="0.6"/>
  <line x1="258" y1="69" x2="318" y2="69" stroke="#5a3a20" stroke-width="0.6"/>

  <!-- Ground floor: 4 numbered doors -->
  <rect x="22" y="98" width="58" height="42" fill="#5a3a20"/>
  <rect x="24" y="100" width="54" height="38" fill="#3c2814"/>
  <circle cx="76" cy="120" r="1.5" fill="#c9a84c"/>
  <text x="51" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a84c">101</text>

  <rect x="102" y="98" width="58" height="42" fill="#5a3a20"/>
  <rect x="104" y="100" width="54" height="38" fill="#3c2814"/>
  <circle cx="156" cy="120" r="1.5" fill="#c9a84c"/>
  <text x="131" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a84c">102</text>

  <rect x="180" y="98" width="58" height="42" fill="#5a3a20"/>
  <rect x="182" y="100" width="54" height="38" fill="#3c2814"/>
  <circle cx="234" cy="120" r="1.5" fill="#c9a84c"/>
  <text x="209" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a84c">103</text>

  <rect x="258" y="98" width="58" height="42" fill="#5a3a20"/>
  <rect x="260" y="100" width="54" height="38" fill="#3c2814"/>
  <circle cx="312" cy="120" r="1.5" fill="#c9a84c"/>
  <text x="287" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c9a84c">104</text>

  <!-- Balcony rail -->
  <rect x="10" y="93" width="338" height="3" fill="#5a3a20"/>
  <!-- AC units -->
  <rect x="70" y="86" width="8" height="4" fill="#a89878"/>
  <rect x="150" y="86" width="8" height="4" fill="#a89878"/>
  <rect x="228" y="86" width="8" height="4" fill="#a89878"/>
  <rect x="306" y="86" width="8" height="4" fill="#a89878"/>
  <!-- Single tree left -->
  <rect x="2" y="110" width="5" height="32" rx="2" fill="#3c2814"/>
  <ellipse cx="4" cy="102" rx="12" ry="14" fill="url(#ldg-foliage)"/>
  <ellipse cx="8" cy="94" rx="9" ry="10" fill="#5a8a44"/>
  <!-- Vignette -->
  <rect width="358" height="180" fill="url(#ldg-vignette)"/>
  <!-- Kasavu border -->
  <rect x="4" y="4" width="350" height="172" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="8" y="8" width="342" height="164" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.7"/>
  <rect x="4" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="4" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
</svg>
