<svg width="358" height="180" viewBox="0 0 358 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aud-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d4b0"/>
      <stop offset="100%" stop-color="#c8aa80"/>
    </linearGradient>
    <linearGradient id="aud-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a8854"/>
      <stop offset="100%" stop-color="#5a6840"/>
    </linearGradient>
    <linearGradient id="aud-wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0c8a0"/>
      <stop offset="100%" stop-color="#b89868"/>
    </linearGradient>
    <linearGradient id="aud-dome" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c5234"/>
      <stop offset="100%" stop-color="#5a3a20"/>
    </linearGradient>
    <linearGradient id="aud-pillar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8d4b0"/>
      <stop offset="100%" stop-color="#c8a878"/>
    </linearGradient>
    <linearGradient id="aud-foliage" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4a6238"/>
      <stop offset="100%" stop-color="#2c3e20"/>
    </linearGradient>
    <radialGradient id="aud-vignette" cx="50%" cy="40%" r="80%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(44,26,14,0.18)"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="358" height="180" fill="url(#aud-sky)"/>
  <!-- Distant trees -->
  <ellipse cx="179" cy="74" rx="240" ry="38" fill="#7a8a5a" opacity="0.38"/>
  <!-- Ground -->
  <rect x="0" y="132" width="358" height="48" fill="url(#aud-ground)"/>
  <ellipse cx="179" cy="150" rx="179" ry="6" fill="#000" opacity="0.18"/>
  <!-- Building base -->
  <rect x="14" y="74" width="330" height="60" fill="url(#aud-wall)"/>
  <rect x="14" y="74" width="8" height="60" fill="#000" opacity="0.14"/>
  <!-- Grand dome -->
  <path d="M14 76 Q179 22 344 76" fill="url(#aud-dome)"/>
  <path d="M22 76 Q179 28 336 76" fill="#000" opacity="0.14"/>
  <!-- Dome highlight -->
  <path d="M100 52 Q179 36 258 52" fill="none" stroke="#a87858" stroke-width="2.5" opacity="0.65"/>
  <!-- Finial cross -->
  <rect x="176" y="15" width="6" height="18" fill="#3c2814"/>
  <rect x="169" y="20" width="20" height="4" fill="#3c2814"/>
  <!-- 6 grand pillars -->
  <rect x="20" y="76" width="16" height="58" fill="url(#aud-pillar)"/>
  <rect x="20" y="76" width="4" height="58" fill="#000" opacity="0.16"/>
  <rect x="32" y="76" width="4" height="58" fill="#fff" opacity="0.14"/>

  <rect x="68" y="76" width="16" height="58" fill="url(#aud-pillar)"/>
  <rect x="68" y="76" width="4" height="58" fill="#000" opacity="0.16"/>
  <rect x="80" y="76" width="4" height="58" fill="#fff" opacity="0.14"/>

  <rect x="120" y="76" width="16" height="58" fill="url(#aud-pillar)"/>
  <rect x="120" y="76" width="4" height="58" fill="#000" opacity="0.16"/>
  <rect x="132" y="76" width="4" height="58" fill="#fff" opacity="0.14"/>

  <rect x="222" y="76" width="16" height="58" fill="url(#aud-pillar)"/>
  <rect x="222" y="76" width="4" height="58" fill="#000" opacity="0.16"/>
  <rect x="234" y="76" width="4" height="58" fill="#fff" opacity="0.14"/>

  <rect x="274" y="76" width="16" height="58" fill="url(#aud-pillar)"/>
  <rect x="274" y="76" width="4" height="58" fill="#000" opacity="0.16"/>
  <rect x="286" y="76" width="4" height="58" fill="#fff" opacity="0.14"/>

  <rect x="322" y="76" width="16" height="58" fill="url(#aud-pillar)"/>
  <rect x="322" y="76" width="4" height="58" fill="#000" opacity="0.16"/>
  <rect x="334" y="76" width="4" height="58" fill="#fff" opacity="0.14"/>

  <!-- Pillar caps -->
  <rect x="16" y="70" width="24" height="8" fill="#5a3a20"/>
  <rect x="64" y="70" width="24" height="8" fill="#5a3a20"/>
  <rect x="116" y="70" width="24" height="8" fill="#5a3a20"/>
  <rect x="218" y="70" width="24" height="8" fill="#5a3a20"/>
  <rect x="270" y="70" width="24" height="8" fill="#5a3a20"/>
  <rect x="318" y="70" width="24" height="8" fill="#5a3a20"/>
  <!-- Pillar bases -->
  <rect x="16" y="130" width="24" height="8" fill="#5a3a20"/>
  <rect x="64" y="130" width="24" height="8" fill="#5a3a20"/>
  <rect x="116" y="130" width="24" height="8" fill="#5a3a20"/>
  <rect x="218" y="130" width="24" height="8" fill="#5a3a20"/>
  <rect x="270" y="130" width="24" height="8" fill="#5a3a20"/>
  <rect x="318" y="130" width="24" height="8" fill="#5a3a20"/>
  <!-- Arched double doors -->
  <rect x="154" y="100" width="50" height="38" fill="#3c2814"/>
  <path d="M154 102 Q179 88 204 102" fill="#5a3a20"/>
  <line x1="179" y1="102" x2="179" y2="138" stroke="#5a3a20" stroke-width="1.2"/>
  <circle cx="156" cy="120" r="1.5" fill="#c9a84c"/>
  <circle cx="202" cy="120" r="1.5" fill="#c9a84c"/>
  <!-- Steps with depth -->
  <rect x="134" y="136" width="90" height="4" fill="#a89878"/>
  <rect x="126" y="140" width="106" height="4" fill="#8a7858"/>
  <rect x="118" y="144" width="122" height="4" fill="#7c6a4a"/>
  <!-- Signboard frieze -->
  <rect x="58" y="56" width="242" height="16" fill="#3c2814"/>
  <rect x="66" y="60" width="90" height="8" fill="#c9a84c" opacity="0.65"/>
  <rect x="164" y="60" width="60" height="8" fill="#c9a84c" opacity="0.45"/>
  <!-- High side windows -->
  <rect x="38" y="84" width="20" height="24" rx="2" fill="#3c4838"/>
  <rect x="300" y="84" width="20" height="24" rx="2" fill="#3c4838"/>
  <!-- Hedges -->
  <ellipse cx="14" cy="140" rx="16" ry="8" fill="url(#aud-foliage)"/>
  <ellipse cx="344" cy="140" rx="16" ry="8" fill="url(#aud-foliage)"/>
  <!-- Vignette -->
  <rect width="358" height="180" fill="url(#aud-vignette)"/>
  <!-- Kasavu border -->
  <rect x="4" y="4" width="350" height="172" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <rect x="8" y="8" width="342" height="164" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.7"/>
  <rect x="4" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="4" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="4" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
  <rect x="338" y="160" width="16" height="16" fill="#C9A84C" opacity="0.2"/>
</svg>
