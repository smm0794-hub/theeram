  <circle cx="280" cy="115" r="4" fill="none" stroke="#D4735E" stroke-width="0.8"/>
  <circle cx="280" cy="130" r="3.5" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
  <circle cx="280" cy="144" r="4" fill="none" stroke="#6B8F71" stroke-width="0.8"/>
  <circle cx="280" cy="158" r="3.5" fill="none" stroke="#D4735E" stroke-width="0.8"/>

