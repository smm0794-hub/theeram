  <line x1="135" y1="130" x2="255" y2="130" stroke="#7C5C3E" stroke-width="1"/>
  <!-- Cloche handle -->
  <ellipse cx="195" cy="76" rx="8" ry="5" fill="none" stroke="#7C5C3E" stroke-width="0.8"/>
  <!-- Plate rim -->
  <ellipse cx="195" cy="133" rx="65" ry="8" fill="none" stroke="#7C5C3E" stroke-width="0.7"/>

  <!-- Fork left -->
  <line x1="110" y1="75" x2="110" y2="155" stroke="#7C5C3E" stroke-width="0.8"/>
  <line x1="104" y1="75" x2="104" y2="100" stroke="#7C5C3E" stroke-width="0.6"/>
  <line x1="107" y1="75" x2="107" y2="100" stroke="#7C5C3E" stroke-width="0.6"/>
  <line x1="113" y1="75" x2="113" y2="100" stroke="#7C5C3E" stroke-width="0.6"/>
  <line x1="116" y1="75" x2="116" y2="100" stroke="#7C5C3E" stroke-width="0.6"/>
  <path d="M104 100 Q110 108 116 100" fill="none" stroke="#7C5C3E" stroke-width="0.6"/>

  <!-- Knife right -->
  <line x1="280" y1="75" x2="280" y2="155" stroke="#7C5C3E" stroke-width="0.8"/>
  <path d="M280 75 Q290 85 285 105 L280 105" fill="none" stroke="#7C5C3E" stroke-width="0.7"/>

  <!-- Spoon far right -->
  <line x1="300" y1="100" x2="300" y2="155" stroke="#7C5C3E" stroke-width="0.7"/>
  <ellipse cx="300" cy="90" rx="7" ry="12" fill="none" stroke="#7C5C3E" stroke-width="0.7"/>

  <!-- Small garnish dots on plate -->
  <circle cx="175" cy="130" r="3" fill="none" stroke="#6B8F71" stroke-width="0.7"/>
  <circle cx="195" cy="128" r="4" fill="none" stroke="#6B8F71" stroke-width="0.7"/>
  <circle cx="215" cy="130" r="3" fill="none" stroke="#6B8F71" stroke-width="0.7"/>

  <!-- Steam lines -->
  <path d="M175 70 Q178 62 175 54" fill="none" stroke="#7C5C3E" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M195 68 Q198 60 195 52" fill="none" stroke="#7C5C3E" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M215 70 Q218 62 215 54" fill="none" stroke="#7C5C3E" stroke-width="0.5" stroke-linecap="round"/>

  <text x="195" y="200" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#7C5C3E">Catering · Pala, Kerala</text>
