<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 220">
  <rect width="390" height="220" fill="#FAF7F2"/>
  <rect x="2" y="2" width="386" height="216" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <rect x="5" y="5" width="380" height="210" fill="none" stroke="#C9A84C" stroke-width="0.4"/>

  <!-- Camera body -->
  <rect x="130" y="80" width="130" height="90" rx="8" fill="none" stroke="#7C5C3E" stroke-width="1.2"/>
  <!-- Camera top hump (viewfinder housing) -->
  <rect x="160" y="68" width="70" height="16" rx="4" fill="none" stroke="#7C5C3E" stroke-width="1"/>
  <!-- Lens circle -->
  <circle cx="195" cy="125" r="30" fill="none" stroke="#7C5C3E" stroke-width="1.2"/>
  <circle cx="195" cy="125" r="22" fill="none" stroke="#7C5C3E" stroke-width="0.7"/>
  <circle cx="195" cy="125" r="14" fill="none" stroke="#7C5C3E" stroke-width="0.5"/>
  <circle cx="195" cy="125" r="5" fill="none" stroke="#7C5C3E" stroke-width="0.8"/>
  <!-- Lens reflection -->
  <path d="M182 115 Q185 112 190 114" fill="none" stroke="#7C5C3E" stroke-width="0.4"/>
  <!-- Shutter button -->
  <circle cx="235" cy="82" r="5" fill="none" stroke="#7C5C3E" stroke-width="0.8"/>
  <!-- Flash hotshoe -->
  <rect x="180" y="63" width="30" height="6" rx="1" fill="none" stroke="#7C5C3E" stroke-width="0.6"/>
  <!-- Grip texture -->
  <line x1="133" y1="90" x2="133" y2="162" stroke="#7C5C3E" stroke-width="0.4"/>
  <line x1="137" y1="90" x2="137" y2="162" stroke="#7C5C3E" stroke-width="0.4"/>
  <line x1="141" y1="90" x2="141" y2="162" stroke="#7C5C3E" stroke-width="0.4"/>
  <!-- Strap lugs -->
  <rect x="126" y="95" width="8" height="12" rx="2" fill="none" stroke="#7C5C3E" stroke-width="0.7"/>
  <rect x="256" y="95" width="8" height="12" rx="2" fill="none" stroke="#7C5C3E" stroke-width="0.7"/>

  <!-- Camera strap -->
  <path d="M130 101 Q80 90 70 110 Q65 130 80 140" fill="none" stroke="#7C5C3E" stroke-width="0.8" stroke-dasharray="3,2"/>
  <path d="M260 101 Q310 90 320 110 Q325 130 310 140" fill="none" stroke="#7C5C3E" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Small stars / bokeh -->
  <circle cx="90" cy="80" r="2" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
  <circle cx="300" cy="75" r="2.5" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
  <circle cx="310" cy="150" r="1.5" fill="none" stroke="#C9A84C" stroke-width="0.8"/>
  <circle cx="75" cy="155" r="2" fill="none" stroke="#C9A84C" stroke-width="0.8"/>

  <text x="195" y="200" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#7C5C3E">Photography &amp; Video · Pala, Kerala</text>
</svg>
